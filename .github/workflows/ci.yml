name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck and shfmt
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.14.1
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: shellcheck -x pve-zfs-tuner.sh pve-zfs-analyzer.sh tests/integration.sh
      - name: Install shfmt
        run: |
          sudo curl -fsSLo /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
      # Formatting settings are in .editorconfig
      - run: shfmt --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - run: bats --version
      - run: bats tests/

  integration:
    name: Integration (real ZFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ZFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux
          sudo modprobe zfs
          cat /sys/module/zfs/version
      - run: sudo tests/integration.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
