name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the scripts have the version of the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for script in pve-zfs-tuner.sh pve-zfs-analyzer.sh; do
            grep -qx "VERSION=\"${version}\"" "$script" || { echo "$script is not version ${version}"; exit 1; }
          done

      - name: Checksums
        run: sha256sum pve-zfs-tuner.sh pve-zfs-analyzer.sh >SHA256SUMS

      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          test -s notes.md || { echo "No CHANGELOG entry for ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md pve-zfs-tuner.sh pve-zfs-analyzer.sh SHA256SUMS
